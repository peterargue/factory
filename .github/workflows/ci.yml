name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Factory scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Shell syntax
        run: for f in plugins/factory/hooks/*.sh plugins/factory/scripts/*.sh tests/*.sh plugins/factory/evals/*/_fixture/*.sh plugins/factory/evals/*/*/fixture.sh; do bash -n "$f"; done
      - name: Manifests parse
        run: jq -e . .claude-plugin/marketplace.json plugins/factory/.claude-plugin/plugin.json plugins/factory/hooks/hooks.json >/dev/null
      - name: Scripts resolve the caller's repository
        run: tests/check-repo-root.sh
      # Moved from tsglobal-ca/platform's ci.yml with the scripts they test.
      - name: The review backstop's queries still work
        run: tests/check-review-queries.sh
      - name: The review verdict still reads its marker correctly
        run: tests/check-review-verdict.sh
      - name: CI results are still attributed to the head commit
        run: tests/check-head-checks-verdict.sh
      - name: pr-cycle's refusals and verdicts
        run: tests/check-pr-cycle.sh
      - name: The signal workflow labels the right PRs
        run: tests/check-factory-signal.sh
      - name: The ready gate refuses an unverified ready
        run: tests/check-deny-unverified-ready.sh
      - name: pr-review-comments reads threads in cloud sessions
        run: tests/check-pr-review-comments.sh
      - name: doctor passes an init-shaped repo and names each breakage
        run: tests/check-doctor.sh
      - name: The rendered standalone reviewer is valid and current
        run: tests/check-render-review-workflow.sh
      - name: The reviewer evals test the shipped reviewer prompt
        run: tests/sync-reviewer-evals.sh --check
